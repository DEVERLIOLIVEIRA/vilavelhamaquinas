<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Implementos Agrícolas - Vila Velha</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Montserrat,sans-serif;
}

body{
background:#fafafa;
color:#222;
}

img{
max-width:100%;
display:block;
}

header{
background:#fff;
position:sticky;
top:0;
z-index:9999;
box-shadow:0 3px 15px rgba(0,0,0,.10);
}

.container{
width:100%;
max-width:1400px;
margin:auto;
padding:0 20px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
padding:22px 0;
flex-wrap:wrap;
}

.logo{
display:flex;
align-items:center;
gap:15px;
}

.logo img{
width:105px;
}

.logo-text h1{
font-size:34px;
font-weight:900;
color:#1d4f1f;
line-height:1;
}

.logo-text p{
font-size:13px;
font-weight:800;
color:#f58220;
}

nav{
display:flex;
gap:15px;
flex-wrap:wrap;
}

nav a{
text-decoration:none;
font-weight:900;
color:#222;
padding:10px 14px;
border-radius:8px;
}

nav a:hover{
background:#1d4f1f;
color:#fff;
}

.hero{
background:#06402B;
color:#fff;
padding:80px 20px;
text-align:center;
}

.hero h2{
font-size:42px;
font-weight:900;
margin-bottom:15px;
}

.hero p{
font-size:18px;
font-weight:600;
}

.search-area{
padding:30px 20px 10px;
text-align:center;
}

.search-area input{
width:100%;
max-width:600px;
padding:16px;
border-radius:12px;
border:1px solid #ccc;
font-size:15px;
outline:none;
}

.products{
max-width:1400px;
margin:30px auto;
padding:0 20px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:26px;
}

.card{
background:#fff;
padding:18px;
border-radius:18px;
box-shadow:0 3px 12px rgba(0,0,0,.08);
transition:.2s;
cursor:pointer;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 8px 22px rgba(0,0,0,.14);
}

.card img{
width:100%;
height:250px;
object-fit:cover;
border-radius:14px;
}

.code{
font-size:13px;
color:#777;
margin-top:12px;
font-weight:800;
}

.card h3{
font-size:18px;
margin:8px 0 14px;
min-height:48px;
}

.qty{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
margin-bottom:12px;
}

.qty button{
padding:8px 14px;
border:none;
border-radius:8px;
background:#ddd;
font-weight:900;
cursor:pointer;
}

.qty span{
font-weight:900;
font-size:16px;
}

.add{
width:100%;
padding:13px;
background:#1d4f1f;
color:#fff;
border:none;
border-radius:10px;
font-weight:900;
cursor:pointer;
}

.add:hover{
background:#143915;
}

.cart{
position:fixed;
right:20px;
bottom:20px;
background:#1d4f1f;
color:#fff;
padding:18px 24px;
border-radius:50px;
cursor:pointer;
font-weight:900;
z-index:99999;
box-shadow:0 5px 18px rgba(0,0,0,.25);
}

.cart span{
background:#f58220;
color:#000;
padding:4px 9px;
border-radius:50%;
margin-left:5px;
}

.panel{
position:fixed;
top:0;
right:-400px;
width:340px;
height:100%;
background:#fff;
z-index:999999;
box-shadow:-5px 0 15px rgba(0,0,0,.2);
transition:.3s;
padding:15px;
overflow-y:auto;
}

.panel.active{
right:0;
}

.close{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
}

.close button{
background:red;
color:#fff;
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
}

.item{
padding:12px;
border-bottom:1px solid #eee;
font-size:13px;
}

.item button{
padding:4px 8px;
margin-top:6px;
border:none;
border-radius:5px;
cursor:pointer;
font-weight:800;
}

.contact-select{
width:100%;
padding:12px;
border-radius:10px;
margin-top:15px;
margin-bottom:10px;
font-weight:700;
border:1px solid #ccc;
}

.send{
width:100%;
padding:14px;
background:#25d366;
color:#fff;
border:none;
border-radius:10px;
font-weight:900;
cursor:pointer;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.72);
z-index:9999999;
display:none;
align-items:center;
justify-content:center;
padding:20px;
}

.modal.active{
display:flex;
}

.modal-box{
background:#fff;
width:100%;
max-width:850px;
border-radius:20px;
overflow:hidden;
position:relative;
animation:openModal .2s ease;
}

@keyframes openModal{
from{
transform:scale(.95);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.modal-close{
position:absolute;
top:12px;
right:12px;
background:red;
color:#fff;
border:none;
width:36px;
height:36px;
border-radius:50%;
font-weight:900;
cursor:pointer;
z-index:2;
}

.modal-content{
display:grid;
grid-template-columns:1fr 1fr;
gap:0;
}

.modal-img{
background:#f1f1f1;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.modal-img img{
width:100%;
height:420px;
object-fit:contain;
border-radius:14px;
}

.modal-info{
padding:30px;
}

.modal-info .code{
font-size:14px;
margin:0 0 8px;
}

.modal-info h2{
font-size:25px;
font-weight:900;
color:#1d4f1f;
margin-bottom:14px;
}

.modal-info p{
font-size:15px;
line-height:1.6;
color:#444;
margin-bottom:14px;
}

.details{
background:#f7f7f7;
border-radius:12px;
padding:14px;
font-size:14px;
line-height:1.7;
margin-bottom:18px;
}

.modal-add{
width:100%;
padding:14px;
background:#1d4f1f;
color:#fff;
border:none;
border-radius:10px;
font-weight:900;
cursor:pointer;
}

footer{
background:#000;
color:#fff;
text-align:center;
padding:35px 20px;
margin-top:60px;
}

footer a{
color:#25d366;
text-decoration:none;
font-weight:800;
}

@media(max-width:768px){

.logo img{
width:80px;
}

.logo-text h1{
font-size:26px;
}

.topbar{
flex-direction:column;
text-align:center;
}

nav{
justify-content:center;
}

.hero h2{
font-size:30px;
}

.products{
grid-template-columns:repeat(2,1fr);
gap:14px;
}

.card{
padding:12px;
}

.card img{
height:160px;
}

.card h3{
font-size:14px;
}

.panel{
width:100%;
right:-100%;
}

.modal-content{
grid-template-columns:1fr;
}

.modal-img img{
height:260px;
}

.modal-info{
padding:22px;
}

}
</style>
</head>

<body>

<header>
<div class="container topbar">

<div class="logo">
<img src="https://i.ibb.co/gZMm5Zzb/somente-logo.png">

<div class="logo-text">
<h1>VILA VELHA</h1>
<p>MÁQUINAS E EQUIPAMENTOS LTDA</p>
</div>
</div>

<nav>
<a href="index.html">VOLTAR PARA PEÇAS</a>
<a href="#produtos">IMPLEMENTOS</a>
<a href="#contato">CONTATO</a>
</nav>

</div>
</header>

<section class="hero">
<h2>IMPLEMENTOS AGRÍCOLAS</h2>
<p>Carretas, pulverizadores, distribuidores, grades, roçadeiras e muito mais.</p>
</section>

<div class="search-area">
<input id="search" oninput="searchImplementos()" placeholder="Buscar implemento...">
</div>

<section id="produtos" class="products"></section>

<footer id="contato">
<p>Vila Velha Máquinas e Equipamentos LTDA</p>
<p>
<a href="https://wa.me/5514996484753" target="_blank">
<i class="fab fa-whatsapp"></i> Falar com Lucas - Implementos
</a>
</p>
</footer>

<div class="cart" onclick="toggleCart()">
Carrinho <span id="count">0</span>
</div>

<div class="panel" id="panel">

<div class="close">
<h3>Carrinho</h3>
<button onclick="toggleCart()">✖</button>
</div>

<div id="cart"></div>

<select id="contactSelect" class="contact-select">
<option value="5514996484753">Lucas - Implementos</option>
<option value="5514998510406">Deverli - Peças e assistência</option>
<option value="5514997393849">Cesar - Peças e implementos</option>
</select>

<button class="send" onclick="send()">Enviar Orçamento</button>

</div>

<div class="modal" id="modal" onclick="closeModalOutside(event)">
<div class="modal-box">

<button class="modal-close" onclick="closeModal()">✖</button>

<div class="modal-content">

<div class="modal-img">
<img id="modalImage" src="">
</div>

<div class="modal-info">
<div class="code" id="modalCode"></div>
<h2 id="modalName"></h2>
<p id="modalDesc"></p>

<div class="details" id="modalDetails"></div>

<button class="modal-add" id="modalAddBtn">Adicionar ao Carrinho</button>
</div>

</div>
</div>
</div>

<script>
let cart = [];
let selectedProduct = null;

const implementos = [
{
code:"IMP001",
name:"Carreta Agrícola 4 Toneladas",
img:"https://i.ibb.co/s4VPwTH/S-LOGO-2.png",
qty:1,
desc:"Carreta agrícola indicada para transporte de cargas no campo, oferecendo praticidade, resistência e agilidade no trabalho rural.",
details:"Capacidade: 4 toneladas<br>Aplicação: transporte agrícola<br>Categoria: carreta agrícola<br>Condição: consultar disponibilidade"
},
{
code:"IMP002",
name:"Carreta Agrícola 5 Toneladas",
img:"https://i.ibb.co/s4VPwTH/S-LOGO-2.png",
qty:1,
desc:"Implemento robusto para transporte de materiais agrícolas, ideal para propriedades que precisam de maior capacidade de carga.",
details:"Capacidade: 5 toneladas<br>Aplicação: transporte rural<br>Categoria: carreta agrícola<br>Condição: consultar disponibilidade"
},
{
code:"IMP003",
name:"Pulverizador Agrícola",
img:"https://i.ibb.co/s4VPwTH/S-LOGO-2.png",
qty:1,
desc:"Pulverizador agrícola utilizado para aplicação de defensivos, fertilizantes líquidos e outros produtos no manejo da lavoura.",
details:"Aplicação: pulverização agrícola<br>Uso: lavouras e propriedades rurais<br>Categoria: pulverizador<br>Condição: consultar disponibilidade"
},
{
code:"IMP004",
name:"Distribuidor de Calcário",
img:"https://i.ibb.co/s4VPwTH/S-LOGO-2.png",
qty:1,
desc:"Distribuidor desenvolvido para aplicação de calcário e insumos agrícolas, auxiliando na correção e preparo do solo.",
details:"Aplicação: distribuição de calcário<br>Uso: preparo e correção de solo<br>Categoria: distribuidor agrícola<br>Condição: consultar disponibilidade"
},
{
code:"IMP005",
name:"Grade Aradora",
img:"https://i.ibb.co/s4VPwTH/S-LOGO-2.png",
qty:1,
desc:"Grade aradora indicada para preparo do solo, incorporação de resíduos e operações agrícolas de maior exigência.",
details:"Aplicação: preparo de solo<br>Uso: aração e incorporação<br>Categoria: grade agrícola<br>Condição: consultar disponibilidade"
},
{
code:"IMP006",
name:"Roçadeira Agrícola",
img:"https://i.ibb.co/s4VPwTH/S-LOGO-2.png",
qty:1,
desc:"Roçadeira agrícola indicada para limpeza de áreas, manutenção de pastagens e controle de vegetação.",
details:"Aplicação: roçagem agrícola<br>Uso: limpeza de áreas rurais<br>Categoria: roçadeira<br>Condição: consultar disponibilidade"
}
];

function render(list){

const grid = document.getElementById("produtos");

grid.innerHTML = "";

list.forEach((p)=>{

grid.innerHTML += `
<div class="card" onclick="openModal('${p.code}')">

<img src="${p.img}">

<div class="code">${p.code}</div>

<h3>${p.name}</h3>

<div class="qty" onclick="event.stopPropagation()">
<button onclick="changeQty('${p.code}',-1)">-</button>
<span>${p.qty}</span>
<button onclick="changeQty('${p.code}',1)">+</button>
</div>

<button class="add" onclick="event.stopPropagation(); addCart('${p.code}')">Adicionar</button>

</div>
`;

});

}

function openModal(code){

let item = implementos.find(p => p.code === code);

if(!item) return;

selectedProduct = item;

document.getElementById("modalImage").src = item.img;
document.getElementById("modalCode").innerHTML = item.code;
document.getElementById("modalName").innerHTML = item.name;
document.getElementById("modalDesc").innerHTML = item.desc;
document.getElementById("modalDetails").innerHTML = item.details;

document.getElementById("modalAddBtn").onclick = function(){
addCart(item.code);
closeModal();
};

document.getElementById("modal").classList.add("active");

}

function closeModal(){
document.getElementById("modal").classList.remove("active");
}

function closeModalOutside(event){
if(event.target.id === "modal"){
closeModal();
}
}

function searchImplementos(){

let value = document.getElementById("search").value.toLowerCase().trim();

if(value === ""){
render(implementos);
return;
}

let results = implementos.filter(p =>
p.name.toLowerCase().includes(value) ||
p.code.toLowerCase().includes(value)
);

render(results);

}

function changeQty(code,val){

let item = implementos.find(p => p.code === code);

if(!item) return;

item.qty += val;

if(item.qty < 1){
item.qty = 1;
}

searchImplementos();

}

function addCart(code){

let item = implementos.find(p => p.code === code);

if(!item) return;

let found = cart.find(c => c.code === item.code);

if(found){
found.qty += item.qty;
}else{
cart.push({...item});
}

updateCart();

}

function updateCart(){

document.getElementById("count").innerText =
cart.reduce((a,b)=>a+b.qty,0);

renderCart();

}

function renderCart(){

let c = document.getElementById("cart");

c.innerHTML = "";

cart.forEach((i,index)=>{

c.innerHTML += `
<div class="item">
<b>${i.code}</b><br>
${i.name}<br>
Qtd: ${i.qty}<br>
<button onclick="cartQty(${index},1)">+</button>
<button onclick="cartQty(${index},-1)">-</button>
<button onclick="removeItem(${index})">Remover</button>
</div>
`;

});

}

function cartQty(index,val){

let item = cart[index];

if(!item) return;

item.qty += val;

if(item.qty <= 0){
cart.splice(index,1);
}

updateCart();

}

function removeItem(index){

cart.splice(index,1);
updateCart();

}

function toggleCart(){

document.getElementById("panel").classList.toggle("active");

}

function send(){

let numero = document.getElementById("contactSelect").value;

let msg = "Olá, gostaria de um orçamento de implementos:%0A%0A";

cart.forEach(i=>{

msg += `${i.qty} und - ${i.code} - ${i.name}%0A`;

});

window.open("https://wa.me/"+numero+"?text="+msg,"_blank");

}

window.onload = function(){
render(implementos);
window.scrollTo(0,0);
};
</script>

</body>
</html>
